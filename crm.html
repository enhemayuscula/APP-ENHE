<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM conectado · Ñ Mayúscula</title>
<style>
:root{--bg:#080808;--panel:#161317;--panel2:#211613;--text:#fff8eb;--muted:#c9bba6;--gold:#f3b83f;--gold2:#ffd76c;--red:#be2a25;--green:#38b980;--blue:#8cc8ff;--line:rgba(255,255,255,.13);--radius:18px;--shadow:0 18px 60px rgba(0,0,0,.42)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 18% -10%,rgba(243,184,63,.28),transparent 34%),radial-gradient(circle at 96% 0%,rgba(190,42,37,.24),transparent 31%),linear-gradient(135deg,#050505,#151012 58%,#050505);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1500px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.brand{display:flex;gap:14px;align-items:center}.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--gold2),var(--gold),#9b1f1c);color:#140c07;display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:var(--shadow)}h1{margin:0 0 6px;font-size:34px}.lead{margin:0;color:var(--muted);line-height:1.45}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:900;text-decoration:none;display:inline-flex;gap:8px;align-items:center}.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#130c07}.btn.dark{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text)}.btn.red{background:linear-gradient(135deg,#d94039,#861613);color:white}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 12;background:rgba(255,255,255,.065);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.metricLabel{display:inline-flex;padding:7px 10px;border-radius:999px;border:1px solid rgba(243,184,63,.45);background:rgba(243,184,63,.14);color:var(--gold2);font-size:12px;font-weight:900}.metric{font-size:34px;font-weight:900;margin:8px 0 2px}.muted{color:var(--muted)}.toolbar{display:grid;grid-template-columns:1.4fr repeat(5,minmax(130px,.6fr));gap:10px;margin:14px 0}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.04em}.field input,.field select{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--text);border-radius:12px;padding:10px;outline:none}.field select option{color:#111}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:16px;max-height:68vh}table{width:100%;border-collapse:collapse;min-width:1600px}th,td{padding:11px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;vertical-align:top;font-size:13px}th{position:sticky;top:0;background:#171318;color:var(--gold2);z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:hover td{background:rgba(255,255,255,.04)}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px;font-weight:800;white-space:nowrap}.pill.green{border-color:rgba(56,185,128,.45);background:rgba(56,185,128,.14);color:#9df2c8}.pill.red{border-color:rgba(190,42,37,.45);background:rgba(190,42,37,.16);color:#ffb7b3}.pill.gold{border-color:rgba(243,184,63,.45);background:rgba(243,184,63,.14);color:var(--gold2)}.pill.blue{border-color:rgba(140,200,255,.45);background:rgba(140,200,255,.13);color:#c8e5ff}.status{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.055);margin-bottom:14px;color:var(--muted);line-height:1.45}.error{border-color:rgba(255,80,80,.45);color:#ffd0d0;background:rgba(190,42,37,.14)}.ok{border-color:rgba(56,185,128,.45);color:#caffdf;background:rgba(56,185,128,.12)}.detailBtn{background:transparent;color:var(--gold2);border:1px solid rgba(243,184,63,.36);border-radius:10px;padding:7px 9px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalBox{width:min(1050px,100%);max-height:92vh;overflow:auto;background:#171318;border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 100px rgba(0,0,0,.62)}.modalHead{position:sticky;top:0;background:#171318;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.modalBody{padding:18px}.kv{display:grid;grid-template-columns:230px 1fr;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);padding:9px 0}.kv b{color:var(--gold2)}.close{background:transparent;color:white;border:1px solid var(--line);border-radius:10px;padding:7px 10px}.small{font-size:12px}.warn{border:1px solid rgba(243,184,63,.38);background:rgba(243,184,63,.09);border-radius:14px;padding:12px;margin-top:12px;color:#ffe3a3}@media(max-width:980px){.wrap{padding:18px}.top{display:grid}.span3,.span4,.span6{grid-column:span 12}.toolbar{grid-template-columns:1fr}.metric{font-size:30px}h1{font-size:28px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand"><div class="logo">Ñ</div><div><h1>CRM conectado · Ñ Mayúscula</h1><p class="lead">Panel conectado en directo a Google Sheets mediante Apps Script. Lectura de oportunidades, respuestas, dossier y seguimiento.</p></div></div>
  <div class="actions"><a class="btn dark" href="./">Volver a la app</a><button class="btn gold" onclick="loadCRM()">Actualizar</button><button class="btn dark" onclick="downloadCSV()">Exportar vista CSV</button></div>
</header>
<div id="status" class="status">Cargando CRM desde Google Sheets...</div>
<section class="grid" id="metrics"></section>
<section class="card" style="margin-top:14px">
  <div class="toolbar">
    <div class="field"><label>Buscar</label><input id="q" placeholder="Organización, email, municipio, respuesta, notas..." oninput="renderTable()"></div>
    <div class="field"><label>Campaña</label><select id="camp" onchange="renderTable()"><option value="">Todas</option></select></div>
    <div class="field"><label>Prioridad</label><select id="prio" onchange="renderTable()"><option value="">Todas</option></select></div>
    <div class="field"><label>Interés</label><select id="interes" onchange="renderTable()"><option value="">Todos</option></select></div>
    <div class="field"><label>Respuesta</label><select id="resp" onchange="renderTable()"><option value="">Todas</option><option value="si">Respondidos</option><option value="no">Sin respuesta</option></select></div>
    <div class="field"><label>Dossier</label><select id="dossier" onchange="renderTable()"><option value="">Todos</option><option value="pendiente">Pendiente</option><option value="enviado">Enviado / borrador</option></select></div>
  </div>
  <div class="muted small" id="count"></div>
  <div class="tableWrap" style="margin-top:10px"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="warn small">Este panel solo lee datos del CRM. No modifica Google Sheets ni envía emails.</div>
</section>
</div>
<div class="modal" id="modal"><div class="modalBox"><div class="modalHead"><strong id="modalTitle">Detalle</strong><button class="close" onclick="closeModal()">×</button></div><div class="modalBody" id="modalBody"></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzf-J9po1859BUk4LWaJyvLI94UCJmvUi_BhL_zBOzljdgwD7_WfkEIzJ1AOvH4bfUcSw/exec';
let rows=[];let metrics={};let visible=[];
const cols=['Organización / Local','Campaña','Segmento','Municipio / Provincia','Email','Teléfono','Prioridad','Estado envío','Respuesta recibida','Fecha respuesta','Interés','Próxima acción','Fecha próxima acción','Enviar dossier','Estado dossier','Último email recibido'];
const detailOrder=['ClaveCRM','Campaña','Origen','Organización / Local','Tipo oportunidad','Segmento','Municipio / Provincia','Dirección','Email','Email CC','Teléfono','Web','Fuente URL','Prioridad','Enviar','Estado envío','Fecha envío','Error envío','Asunto enviado','Respuesta recibida','Fecha respuesta','Persona contacto','Teléfono contacto','Interés','Disponibilidad / fechas','Condiciones','Caché / presupuesto','Requisitos técnicos','Próxima acción','Fecha próxima acción','Notas seguimiento','Última importación','Observaciones origen','Último email recibido','Email remitente respuesta','Enviar dossier','Dossier enviado','Fecha envío dossier','Tipo respuesta dossier','Notas dossier','Estado dossier'];
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function norm(v){return String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function setStatus(html,type){const s=document.getElementById('status');s.innerHTML=html;s.className='status '+(type||'')}
async function loadCRM(){setStatus('Cargando CRM desde Google Sheets...');try{const url=API_URL+'?action=crm&ts='+Date.now();const res=await fetch(url,{method:'GET',cache:'no-store'});if(!res.ok)throw new Error('Respuesta HTTP '+res.status);const json=await res.json();if(!json.ok)throw new Error(json.error||'La API respondió sin ok=true');rows=Array.isArray(json.data)?json.data:[];metrics=json.metrics||calcMetrics(rows);setStatus('CRM cargado correctamente: <strong>'+rows.length+'</strong> registros. Última actualización: '+new Date().toLocaleString('es-ES'),'ok');fillFilters();renderMetrics();renderTable()}catch(e){setStatus('<strong>No se pudo leer la API.</strong><br>'+esc(e.message)+'<br><br>Abre la URL de Apps Script directamente y confirma que devuelve JSON.','error')}}
function isYes(v){const n=norm(v);return n==='si'||n==='sí'||n==='s'||n==='yes'||n==='true'}
function hasResponse(r){return isYes(r['Respuesta recibida'])||!!String(r['Último email recibido']||'').trim()||!!String(r['Fecha respuesta']||'').trim()}
function calcMetrics(data){const total=data.length;const respuestas=data.filter(hasResponse).length;const interesados=data.filter(function(r){const n=norm(r['Interés']);return n.includes('alto')||n.includes('medio')||n.includes('interesado')||n==='si'||n==='sí'}).length;const enviados=data.filter(function(r){return norm(r['Estado envío']).includes('enviado')||!!r['Fecha envío']}).length;const pendientesEnvio=data.filter(function(r){return isYes(r['Enviar'])&&!norm(r['Estado envío']).includes('enviado')}).length;const dossierPendiente=data.filter(function(r){return isYes(r['Enviar dossier'])&&!r['Fecha envío dossier']&&!norm(r['Estado dossier']).includes('borrador')&&!isYes(r['Dossier enviado'])}).length;const dossierEnviado=data.filter(function(r){return isYes(r['Dossier enviado'])||!!r['Fecha envío dossier']||norm(r['Estado dossier']).includes('borrador')}).length;const altaPrioridad=data.filter(function(r){return norm(r['Prioridad']).includes('alta')}).length;const prox=data.filter(function(r){return String(r['Próxima acción']||'').trim()}).length;return{total,enviados,pendientesEnvio,respuestas,interesados,dossierPendiente,dossierEnviado,altaPrioridad,prox,ratioRespuesta:total?Math.round(respuestas/total*100):0,ratioInteres:respuestas?Math.round(interesados/respuestas*100):0}}
function renderMetrics(){const c=calcMetrics(rows);const m=Object.assign({},c,metrics);const items=[['Total oportunidades',m.total||rows.length,'Base CRM'],['Emails enviados',m.enviados||0,'Estado envío'],['Pendientes envío',m.pendientesEnvio||0,'Enviar = SI no enviado'],['Respuestas',m.respuestas||0,(m.ratioRespuesta||0)+'% sobre total'],['Interesados',m.interesados||0,(m.ratioInteres||0)+'% sobre respuestas'],['Alta prioridad',m.altaPrioridad||0,'Seguimiento preferente'],['Dossier pendiente',m.dossierPendiente||0,'Enviar dossier'],['Dossier enviado',m.dossierEnviado||0,'Enviado o borrador'],['Próximas acciones',m.prox||0,'Acciones abiertas']];document.getElementById('metrics').innerHTML=items.map(function(it){return '<div class="card span3"><span class="metricLabel">'+esc(it[0])+'</span><div class="metric">'+esc(it[1])+'</div><div class="muted">'+esc(it[2])+'</div></div>'}).join('')}
function unique(col){return Array.from(new Set(rows.map(function(r){return String(r[col]||'').trim()}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,'es')})}
function fillSelect(id,values){const s=document.getElementById(id);const current=s.value;const first=s.options[0].outerHTML;s.innerHTML=first+values.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>'}).join('');s.value=current}
function fillFilters(){fillSelect('camp',unique('Campaña'));fillSelect('prio',unique('Prioridad'));fillSelect('interes',unique('Interés'))}
function dossierMatch(r,mode){if(!mode)return true;const estado=norm([r['Dossier enviado'],r['Fecha envío dossier'],r['Estado dossier']].join(' '));const enviar=norm(r['Enviar dossier']);if(mode==='pendiente')return (enviar==='si'||enviar==='sí')&&!estado.includes('si')&&!estado.includes('borrador')&&!r['Fecha envío dossier'];if(mode==='enviado')return estado.includes('si')||estado.includes('borrador')||!!r['Fecha envío dossier'];return true}
function renderTable(){const q=norm(document.getElementById('q').value);const camp=document.getElementById('camp').value;const prio=document.getElementById('prio').value;const interes=document.getElementById('interes').value;const resp=document.getElementById('resp').value;const dossier=document.getElementById('dossier').value;visible=rows.filter(function(r){const hay=!q||norm(Object.values(r).join(' ')).includes(q);const respOk=!resp||(resp==='si'?hasResponse(r):!hasResponse(r));return hay&&(!camp||r['Campaña']===camp)&&(!prio||r['Prioridad']===prio)&&(!interes||r['Interés']===interes)&&respOk&&dossierMatch(r,dossier)});document.getElementById('count').textContent='Mostrando '+visible.length+' de '+rows.length+' registros';document.querySelector('#tbl thead').innerHTML='<tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'<th>Detalle</th></tr>';document.querySelector('#tbl tbody').innerHTML=visible.map(function(r,i){return '<tr>'+cols.map(function(c){return '<td>'+formatCell(c,r[c],r)+'</td>'}).join('')+'<td><button class="detailBtn" onclick="openDetail('+i+')">Ver</button></td></tr>'}).join('')||'<tr><td colspan="17" class="muted">No hay registros con esos filtros.</td></tr>'}
function formatCell(c,v,r){const n=norm(v);if(c==='Prioridad'&&n.includes('alta'))return '<span class="pill red">'+esc(v)+'</span>';if(c==='Respuesta recibida'&&hasResponse(r))return '<span class="pill green">Sí</span>';if(c==='Estado envío'&&n.includes('enviado'))return '<span class="pill green">'+esc(v)+'</span>';if(c==='Interés'&&(n.includes('alto')||n.includes('medio')))return '<span class="pill gold">'+esc(v)+'</span>';if(c==='Estado dossier'&&n.includes('borrador'))return '<span class="pill blue">'+esc(v)+'</span>';return esc(v)}
function openDetail(i){const r=visible[i];document.getElementById('modalTitle').textContent=r['Organización / Local']||r['Email']||'Detalle CRM';document.getElementById('modalBody').innerHTML=detailOrder.filter(function(k){return r[k]}).map(function(k){return '<div class="kv"><b>'+esc(k)+'</b><div>'+esc(r[k]).replace(/\n/g,'<br>')+'</div></div>'}).join('')||'<p class="muted">Sin datos.</p>';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function downloadCSV(){const header=cols;const list=visible.length?visible:rows;const lines=[header].concat(list.map(function(r){return header.map(function(c){return r[c]||''})})).map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(';')}).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines],{type:'text/csv;charset=utf-8'}));a.download='crm-enhe-vista.csv';a.click();URL.revokeObjectURL(a.href)}
window.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});loadCRM();
</script>
</body>
</html>
